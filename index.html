<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Integrated HSE Management System</title>

    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0f3d5c" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IHMS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Markazi+Text:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./boot-loader.css" />
  </head>
  <body>
    <!-- صفحه‌ی بارگذاریِ اولیه — پیش از اینکه React اصلاً بارگذاری/اجرا شود
         نمایش داده می‌شود (به همین دلیل باید همین‌جا، در HTMLِ خام باشد، نه
         تزریق‌شده با جاوااسکریپت). با آماده‌شدنِ اپ، main.jsx آن را با یک
         محو شدنِ نرم پاک می‌کند — رجوع کنید به hideBootLoader() در main.jsx. -->
    <div id="ihms-boot" aria-hidden="true">
      <div id="ihms-boot__inner">
        <img id="ihms-boot__logo" src="./logo.png" alt="" />
        <div id="ihms-boot__track"><div id="ihms-boot__fill"></div></div>
      </div>
    </div>
    <!-- زمانِ واقعیِ شروعِ نمایشِ صفحه‌ی بارگذاری — همین‌جا، پیش از هر
         اسکریپتِ ماژولی، تا main.jsx بتواند حداقلِ ۳ ثانیه را از لحظه‌ی
         واقعیِ دیده‌شدنِ لوگو حساب کند، نه از لحظه‌ی اجرای خودش. -->
    <script>window.__ihmsBootStart = Date.now();</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
